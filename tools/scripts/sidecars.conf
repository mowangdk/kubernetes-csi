# Sidecar update channels consumed by isolated_sync.py --update-sources
# Normal sync uses tools/assembly/sources.lock.json, never these moving refs.
#
# One entry per line: <sidecar>,<branch>
#   <sidecar> is the kubernetes-csi/external-<sidecar> repository suffix.
#   <branch>  is the upstream branch to resolve for a validated candidate.
#
# Lines starting with '#' and blank lines are ignored.
#
# NOTE: attacher follows release-4.12 because attacher master bumped the
# k8s.io libs to v0.37.0 (external-attacher@42d557be) while provisioner master
# still requires v0.36.1; the sync sanity check requires all sidecars to agree
# on the k8s.io/api version. Revert to master once provisioner follows.
attacher,release-4.12
provisioner,master
resizer,master
snapshotter,master
